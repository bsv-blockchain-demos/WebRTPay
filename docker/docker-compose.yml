# Local STUN/TURN (coturn) and WebRTPay relay, for development and `npm run test:turn`:
#
#   docker compose -f docker/docker-compose.yml up -d --build
#   npm run test:turn
#   docker compose -f docker/docker-compose.yml down
#
# Everything is published on 127.0.0.1 only. The TURN secret is public: never deploy this.
name: webrtpay

services:
  coturn:
    image: coturn/coturn:4.18.0-alpine3.24
    command: ['-c', '/etc/coturn/turnserver.conf']
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - '127.0.0.1:3478:3478/udp'
      - '127.0.0.1:3478:3478/tcp'
      # Relayed addresses, advertised as 127.0.0.1 (external-ip). Two relay-only peers
      # never use them from outside: coturn relays between its allocations internally.
      - '127.0.0.1:49160-49200:49160-49200/udp'
    networks:
      turn:
        # relay-ip, external-ip and allowed-peer-ip in turnserver.conf name this address
        ipv4_address: 172.30.78.10

  relay:
    build:
      context: ..
      dockerfile: docker/relay.Dockerfile
    image: webrtpay-relay:dev
    environment:
      HOST: 0.0.0.0
      PORT: '8787'
      # The relay listens on every container address, so it must know the url clients
      # sign (Ruling 19). It logs a warning that TRUSTED_IP_HEADER is unset: here every
      # client does arrive from Docker's address, which shares the per-source limits.
      PUBLIC_URLS: ws://127.0.0.1:8787
      STUN_URLS: stun:127.0.0.1:3478
      TURN_SECRET: webrtpay-dev-secret
      TURN_URLS: turn:127.0.0.1:3478
      # Every client here arrives from Docker's address, so the default 6 TURN credential
      # sets an hour per address would stop `npm run test:turn` after a few runs. 600 is
      # also the relay's total per hour.
      TURN_PER_IP_PER_HOUR: '600'
    ports:
      - '127.0.0.1:8787:8787'
    networks:
      - turn
    depends_on:
      - coturn
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8787/health']
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  turn:
    ipam:
      config:
        # Change it (and the address above and in turnserver.conf) if it clashes with a
        # network on this machine.
        - subnet: 172.30.78.0/24
